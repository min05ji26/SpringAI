spring.application.name=Policy

# 채팅은 Groq(openai 방식), 임베딩은 로컬 ollama
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

spring.ai.openai.api-key=${OPEN_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=bge-m3

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# vector_store 테이블이 없으면 자동으로 만들어줌
spring.ai.vectorstore.pgvector.initialize-schema=true

# 키는 SpringAI/secret.properties 에서 읽음 (IntelliJ 실행 = ./, gradlew bootRun = ../)
spring.config.import=optional:file:./secret.properties,optional:file:../secret.properties

# week05랑 같은 DB를 쓰니까, 헌법 문서와 섞이지 않게 정책은 따로 테이블에 저장
spring.ai.vectorstore.pgvector.table-name=policy_store
