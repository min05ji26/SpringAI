<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정책 추천</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            width: 500px;
            max-width: calc(100% - 32px);
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #ccc;
        }

        .form {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 0 12px;
        }

        .input-wrap:focus-within {
            border-color: #333;
        }

        .input-wrap input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 0;
            font-size: 14px;
            min-width: 0;
        }

        .input-wrap span {
            font-size: 14px;
            color: #888;
        }

        .gender {
            display: flex;
            gap: 10px;
        }

        .gender input {
            display: none;
        }

        .gender label {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-weight: normal;
            cursor: pointer;
            margin: 0;
        }

        .gender input:checked + label {
            background-color: #333;
            border-color: #333;
            color: white;
        }

        #sendBtn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #sendBtn:hover {
            background-color: #555;
        }

        #sendBtn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .error {
            color: #d33;
            font-size: 13px;
            min-height: 16px;
            margin: -8px 0 0;
        }

        .result {
            display: none;
            border-top: 1px solid #ddd;
            padding: 20px;
        }

        .result.show {
            display: block;
        }

        .summary {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #eee;
            border-radius: 15px;
            padding: 18px;
        }

        .card .icon {
            font-size: 32px;
        }

        .card .type {
            display: inline-block;
            font-size: 12px;
            background-color: #333;
            color: white;
            border-radius: 10px;
            padding: 3px 10px;
            margin-bottom: 6px;
        }

        .card .name {
            font-size: 18px;
            font-weight: bold;
            word-break: keep-all;
        }

        .want-input {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        .want-input:focus {
            border-color: #333;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .chips button {
            border: 1px solid #ccc;
            background: white;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .chips button:hover {
            border-color: #333;
        }

        .card .reason {
            font-size: 13px;
            color: #555;
            margin-top: 6px;
            line-height: 1.4;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            margin: 20px 0 8px;
        }

        .hit {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .hit-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .hit-score {
            color: #888;
            font-weight: normal;
            white-space: nowrap;
        }

        .hit-text {
            color: #666;
            line-height: 1.4;
        }

        .bar {
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .bar div {
            height: 100%;
            background: #333;
        }

        .hit.picked {
            border-color: #333;
        }

        .footer {
            border-top: 1px solid #ddd;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
            gap: 10px;
        }

        #addBtn {
            border: 1px solid #ccc;
            background: white;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .notice {
            font-size: 12px;
            color: #888;
            line-height: 1.5;
            margin-top: 12px;
        }

        .notice a {
            color: #333;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #888;
            font-size: 14px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #ddd;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🏛️ 맞춤 정책 추천</h1>
        <p>정책 DB에서 조건에 맞는 정책을 벡터 검색으로 찾고, AI가 그 중에서 골라드려요</p>
    </div>

    <div class="form">
        <div class="field">
            <label for="age">나이</label>
            <div class="input-wrap">
                <input type="number" id="age" min="0" max="120" placeholder="예) 24">
                <span>살</span>
            </div>
        </div>

        <div class="field">
            <label>성별</label>
            <div class="gender">
                <input type="radio" name="gender" id="female" value="여자" checked>
                <label for="female">여자</label>
                <input type="radio" name="gender" id="male" value="남자">
                <label for="male">남자</label>
            </div>
        </div>

        <div class="field">
            <label for="income">월 소득</label>
            <div class="input-wrap">
                <input type="number" id="income" min="0" placeholder="예) 150">
                <span>만원</span>
            </div>
        </div>

        <div class="field">
            <label for="want">원하는 도움</label>
            <input type="text" id="want" class="want-input" placeholder="예) 자취방 월세가 부담돼요">
            <div class="chips">
                <button type="button">자취방 월세</button>
                <button type="button">목돈 모으기</button>
                <button type="button">자격증 공부</button>
                <button type="button">취업 준비</button>
                <button type="button">교통비 줄이기</button>
            </div>
        </div>

        <p id="error" class="error"></p>

        <button id="sendBtn">정책 찾기</button>
    </div>

    <div id="result" class="result"></div>

    <div class="footer">
        <span id="addMsg">처음 실행했다면 정책 자료를 먼저 넣어주세요</span>
        <button id="addBtn">정책 데이터 넣기</button>
    </div>

</div>

<script>
    const ageInput = document.getElementById("age");
    const incomeInput = document.getElementById("income");
    const wantInput = document.getElementById("want");
    const sendBtn = document.getElementById("sendBtn");
    const errorBox = document.getElementById("error");
    const resultBox = document.getElementById("result");

    // 분류(type)별 아이콘
    const icons = {
        "주거": "🏠",
        "배움": "📚",
        "교육": "📚",
        "저축": "💰",
        "자산": "💰",
        "소득": "💵",
        "복지": "🤝",
        "일자리": "💼",
        "취업": "💼",
        "대출": "🏦",
        "금융": "🏦",
        "건강": "🏥",
        "생활": "🤝",
        "교통": "🚌",
        "의료": "🏥"
    };

    sendBtn.addEventListener("click", recommend);

    // 예시 버튼을 누르면 원하는 도움 칸에 채워넣기
    document.querySelectorAll(".chips button").forEach(btn => {
        btn.addEventListener("click", () => {
            wantInput.value = btn.textContent;
        });
    });

    // 정책 자료를 벡터 DB에 넣기 (/policy/add)
    document.getElementById("addBtn").addEventListener("click", async () => {
        const addBtn = document.getElementById("addBtn");
        const addMsg = document.getElementById("addMsg");
        addBtn.disabled = true;
        addMsg.textContent = "임베딩해서 저장하는 중...";
        try {
            const response = await fetch("/policy/add", { method: "POST" });
            if (!response.ok) throw new Error(response.status);
            addMsg.textContent = "정책 자료를 넣었어요. 다시 누르면 중복으로 들어가요!";
        } catch (err) {
            addMsg.textContent = "저장 실패 (" + err.message + ")";
            addBtn.disabled = false;
        }
    });

    // 입력칸에서 엔터를 눌러도 전송
    [ageInput, incomeInput, wantInput].forEach(input => {
        input.addEventListener("keydown", e => {
            if (e.key === "Enter") recommend();
        });
    });

    async function recommend() {
        const age = ageInput.value.trim();
        const income = incomeInput.value.trim();
        const gender = document.querySelector("input[name='gender']:checked").value;
        const want = wantInput.value.trim() || "나에게 맞는 지원 정책";

        if (age === "" || income === "") {
            errorBox.textContent = "나이와 월 소득을 모두 입력해주세요.";
            return;
        }
        errorBox.textContent = "";

        // 필터에 쓰려고 나이·성별·소득을 따로따로 보낸다
        const info = `${age}살, ${gender}, 월 ${income}만원, 원하는 것 : ${want}`;
        const params = { age: age, gender: gender, income: income, want: want };

        sendBtn.disabled = true;
        resultBox.classList.add("show");
        resultBox.innerHTML = `
            <div class="loading"><div class="spinner"></div>AI가 정책을 찾고 있어요...</div>
        `;

        try {
            // /search : 벡터 검색 결과(후보), /reco : 후보 중 AI가 고른 결과
            const [hits, text] = await Promise.all([
                post("/policy/search", params).then(r => r.json()),
                post("/policy/reco", params).then(r => r.text())
            ]);

            const policy = parsePolicy(text);
            showResult(info, policy, hits);

        } catch (err) {
            resultBox.innerHTML = `<p class="error">추천을 불러오지 못했어요. ${escapeHtml(err.message)}</p>`;
        } finally {
            sendBtn.disabled = false;
        }
    }

    async function post(url, params) {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams(params)
        });
        if (!response.ok) {
            throw new Error("서버 응답 오류 (" + response.status + ")");
        }
        return response;
    }

    // 모델이 ```json ... ``` 으로 감싸서 줄 때도 있어서 { } 부분만 꺼내서 파싱
    function parsePolicy(text) {
        const start = text.indexOf("{");
        const end = text.lastIndexOf("}");
        if (start === -1 || end === -1) {
            throw new Error("응답 형식이 올바르지 않아요.");
        }
        return JSON.parse(text.substring(start, end + 1));
    }

    function showResult(info, policy, hits) {
        const name = policy.policy_name || "알 수 없음";
        const type = policy.type || "기타";
        const icon = icons[type] || "📌";

        resultBox.innerHTML = `
            <div class="summary">${escapeHtml(info)} 기준 추천 결과</div>
            <div class="card">
                <div class="icon">${icon}</div>
                <div>
                    <div class="type">${escapeHtml(type)}</div>
                    <div class="name">${escapeHtml(name)}</div>
                    ${policy.reason ? `<div class="reason">${escapeHtml(policy.reason)}</div>` : ""}
                </div>
            </div>

            <div class="section-title">🔍 벡터 검색으로 찾은 후보 (조건 필터 + 유사도)</div>
            ${hits.length === 0
                ? `<div class="hit-text">조건에 맞는 정책이 없어요.</div>`
                : hits.map(hit => `
                    <div class="hit ${hit.name === name ? "picked" : ""}">
                        <div class="hit-top">
                            <span>${icons[hit.type] || "📌"} ${escapeHtml(hit.name)}${hit.name === name ? " ✓" : ""}</span>
                            <span class="hit-score">유사도 ${hit.score.toFixed(3)}</span>
                        </div>
                        <div class="hit-text">${escapeHtml(hit.text)}</div>
                        <div class="bar"><div style="width:${Math.round(hit.score * 100)}%"></div></div>
                    </div>
                `).join("")}

            <div class="notice">
                ※ AI는 위 후보 안에서만 골라요. 정책 자료는 직접 넣은 초안이라 실제 지원 조건과 다를 수 있어요.
                신청 전 <a href="https://www.bokjiro.go.kr" target="_blank" rel="noopener">복지로</a>에서 꼭 확인하세요.
            </div>
        `;
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }
</script>

</body>
</html>
