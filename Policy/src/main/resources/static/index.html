<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정책 추천</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            width: 500px;
            max-width: calc(100% - 32px);
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #ccc;
        }

        .form {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 0 12px;
        }

        .input-wrap:focus-within {
            border-color: #333;
        }

        .input-wrap input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 0;
            font-size: 14px;
            min-width: 0;
        }

        .input-wrap span {
            font-size: 14px;
            color: #888;
        }

        .gender {
            display: flex;
            gap: 10px;
        }

        .gender input {
            display: none;
        }

        .gender label {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-weight: normal;
            cursor: pointer;
            margin: 0;
        }

        .gender input:checked + label {
            background-color: #333;
            border-color: #333;
            color: white;
        }

        #sendBtn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #sendBtn:hover {
            background-color: #555;
        }

        #sendBtn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .error {
            color: #d33;
            font-size: 13px;
            min-height: 16px;
            margin: -8px 0 0;
        }

        .result {
            display: none;
            border-top: 1px solid #ddd;
            padding: 20px;
        }

        .result.show {
            display: block;
        }

        .summary {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #eee;
            border-radius: 15px;
            padding: 18px;
        }

        .card .icon {
            font-size: 32px;
        }

        .card .type {
            display: inline-block;
            font-size: 12px;
            background-color: #333;
            color: white;
            border-radius: 10px;
            padding: 3px 10px;
            margin-bottom: 6px;
        }

        .card .name {
            font-size: 18px;
            font-weight: bold;
            word-break: keep-all;
        }

        .notice {
            font-size: 12px;
            color: #888;
            line-height: 1.5;
            margin-top: 12px;
        }

        .notice a {
            color: #333;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #888;
            font-size: 14px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #ddd;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🏛️ 맞춤 정책 추천</h1>
        <p>나이, 성별, 월 소득을 입력하면 AI가 받을 수 있는 정책을 찾아드려요</p>
    </div>

    <div class="form">
        <div class="field">
            <label for="age">나이</label>
            <div class="input-wrap">
                <input type="number" id="age" min="0" max="120" placeholder="예) 24">
                <span>살</span>
            </div>
        </div>

        <div class="field">
            <label>성별</label>
            <div class="gender">
                <input type="radio" name="gender" id="female" value="여자" checked>
                <label for="female">여자</label>
                <input type="radio" name="gender" id="male" value="남자">
                <label for="male">남자</label>
            </div>
        </div>

        <div class="field">
            <label for="income">월 소득</label>
            <div class="input-wrap">
                <input type="number" id="income" min="0" placeholder="예) 150">
                <span>만원</span>
            </div>
        </div>

        <p id="error" class="error"></p>

        <button id="sendBtn">정책 찾기</button>
    </div>

    <div id="result" class="result"></div>

</div>

<script>
    const ageInput = document.getElementById("age");
    const incomeInput = document.getElementById("income");
    const sendBtn = document.getElementById("sendBtn");
    const errorBox = document.getElementById("error");
    const resultBox = document.getElementById("result");

    // 분류(type)별 아이콘
    const icons = {
        "주거": "🏠",
        "배움": "📚",
        "교육": "📚",
        "저축": "💰",
        "자산": "💰",
        "소득": "💵",
        "복지": "🤝",
        "일자리": "💼",
        "취업": "💼",
        "대출": "🏦",
        "금융": "🏦",
        "건강": "🏥",
        "의료": "🏥"
    };

    sendBtn.addEventListener("click", recommend);

    // 입력칸에서 엔터를 눌러도 전송
    [ageInput, incomeInput].forEach(input => {
        input.addEventListener("keydown", e => {
            if (e.key === "Enter") recommend();
        });
    });

    async function recommend() {
        const age = ageInput.value.trim();
        const income = incomeInput.value.trim();
        const gender = document.querySelector("input[name='gender']:checked").value;

        if (age === "" || income === "") {
            errorBox.textContent = "나이와 월 소득을 모두 입력해주세요.";
            return;
        }
        errorBox.textContent = "";

        // 백엔드는 info 하나만 받으므로 "24살, 여자, 월 150만원" 형태로 합쳐서 보낸다
        const info = `${age}살, ${gender}, 월 ${income}만원`;

        sendBtn.disabled = true;
        resultBox.classList.add("show");
        resultBox.innerHTML = `
            <div class="loading"><div class="spinner"></div>AI가 정책을 찾고 있어요...</div>
        `;

        try {
            const response = await fetch("/policy/reco", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({ info: info })
            });

            if (!response.ok) {
                throw new Error("서버 응답 오류 (" + response.status + ")");
            }

            const text = await response.text();
            const policy = parsePolicy(text);
            showResult(info, policy);

        } catch (err) {
            resultBox.innerHTML = `<p class="error">추천을 불러오지 못했어요. ${escapeHtml(err.message)}</p>`;
        } finally {
            sendBtn.disabled = false;
        }
    }

    // 모델이 ```json ... ``` 으로 감싸서 줄 때도 있어서 { } 부분만 꺼내서 파싱
    function parsePolicy(text) {
        const start = text.indexOf("{");
        const end = text.lastIndexOf("}");
        if (start === -1 || end === -1) {
            throw new Error("응답 형식이 올바르지 않아요.");
        }
        return JSON.parse(text.substring(start, end + 1));
    }

    function showResult(info, policy) {
        const name = policy.policy_name || "알 수 없음";
        const type = policy.type || "기타";
        const icon = icons[type] || "📌";

        resultBox.innerHTML = `
            <div class="summary">${escapeHtml(info)} 기준 추천 결과</div>
            <div class="card">
                <div class="icon">${icon}</div>
                <div>
                    <div class="type">${escapeHtml(type)}</div>
                    <div class="name">${escapeHtml(name)}</div>
                </div>
            </div>
            <div class="notice">
                ※ AI가 추천한 결과라 실제 지원 조건과 다르거나 종료된 정책일 수 있어요.
                신청 전 <a href="https://www.bokjiro.go.kr" target="_blank" rel="noopener">복지로</a>에서 꼭 확인하세요.
            </div>
        `;
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }
</script>

</body>
</html>
